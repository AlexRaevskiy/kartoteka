# ─────────────────────────────────────────────────────────────────────────────
# Netlify configuration for Kartoteka (Vite + React SPA + PWA)
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # firebase-admin ships native/optional deps — include it as a normal node_module instead of bundling.
  external_node_modules = ["firebase-admin"]

[build.environment]
  NODE_VERSION = "22"
  # Firebase web config values are public by design (security comes from Firestore rules),
  # and Vite inlines them into the bundle. Tell Netlify's secret scanner not to fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_VAPID_KEY"

# ── Redirects (order matters: first match wins) ──────────────────────────────

# OPTIONAL but recommended for Google sign-in on iPhone / installed PWAs.
# Proxies Firebase's auth handler through your own domain so sign-in works even when the
# browser blocks third-party storage (Safari, Chrome). To enable:
#   1. Replace YOUR-PROJECT-ID below and uncomment the 5 lines.
#   2. Set VITE_FIREBASE_AUTH_DOMAIN to your Netlify domain (e.g. kartoteka.netlify.app).
#   3. Add https://<your-netlify-domain>/__/auth/handler as an Authorized redirect URI
#      in Google Cloud Console → APIs & Services → Credentials → your OAuth web client.
# [[redirects]]
#   from = "/__/auth/*"
#   to = "https://YOUR-PROJECT-ID.firebaseapp.com/__/auth/:splat"
#   status = 200
#   force = true

# SPA fallback for React Router: /deck/:id, /folder/:id, /profile … all serve index.html,
# so refreshing or opening a shared link never 404s.
# (Real files such as /assets/*.js or /sw.js are served normally because this rule is not forced.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Headers ──────────────────────────────────────────────────────────────────

# The service worker and manifest must never be cached by the CDN/browser,
# otherwise users would be stuck on an old version of the app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Google sign-in uses a popup that must be able to talk back to this window.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
